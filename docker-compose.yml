services:
  # Named "chronodemica-backend" rather than plain "backend": nginx's proxy_pass
  # (frontend/nginx.conf) resolves this name via Docker's embedded DNS, which is
  # queryable across any other network the frontend container joins (e.g. a shared
  # reverse-proxy network) — a generic name risks colliding with an unrelated
  # service of the same name on that network.
  chronodemica-backend:
    image: ghcr.io/codingbeanie/chronodemica_redux-backend:latest
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: sqlite:////data/chronodemica.db
      CORS_ORIGINS: '["http://localhost:5173"]'
    env_file:
      - .env
    volumes:
      - backend_data:/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/codingbeanie/chronodemica_redux-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - chronodemica-backend
    restart: unless-stopped

volumes:
  backend_data:
