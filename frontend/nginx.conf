server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker's embedded DNS, resolved at request time via a variable — a plain
        # `proxy_pass http://chronodemica-backend:8010` resolves once at startup and
        # never again, so nginx would refuse to start (or get stuck on a stale IP) if
        # the backend container isn't up yet or gets recreated.
        #
        # Named "chronodemica-backend" rather than plain "backend": if this frontend
        # container ever joins a Docker network shared with other compose stacks (e.g.
        # a reverse-proxy network), a generic name like "backend" can collide with an
        # unrelated service of the same name on that shared network, silently proxying
        # requests to the wrong container.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream chronodemica-backend:8010;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
